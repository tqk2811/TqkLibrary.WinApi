name: Test

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # TqkLibrary.WinApi.Test only has a placeholder test (real window handles are commented out), so it runs as is.
      # Skip GitVersion: it fails on branches without a full SemVer tag.
      - name: Test
        run: >
          dotnet test TqkLibrary.WinApi.Test/TqkLibrary.WinApi.Test.csproj -c Release
          -p:DisableGitVersionTask=true -p:Version=0.0.0
